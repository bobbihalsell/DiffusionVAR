# algorithm
algo: 'diffusion-var'  # 'diffusion-var' or 'var'

# wandb configuration
wandb_run_id: 'DVAR'            # set to specific run ID to resume (if exists) or create new run with this ID
enable_wandb: true              
wandb_project: 'diffusion-var'  # WandB project name for logging
wandb_it: 100                   # log every wandb_it steps
# wandb_tags: ['diffusion', 'var', 'autoregressive'] TODO

output_dir_name: 'checkpoints/dvar'  # training output directory

# data configuration
data_path: '/vol/bitbucket/blh124/project/dvar/imagenet_subset_10'  # path to dataset 
exp_name: 'dvar'                                                   # experiment name

# VAE configuration
vfast: 0                       # torch.compile VAE; 0: not compile; 1: reduce-overhead; 2: max-autotune
vae_ckpt: './vqvae/vqvae.pth'  # VAE checkpoint path
vae_vocab_size: 4096      
vae_z_channels: 32        
vae_ch: 160                
vae_share_quant_resi: 4    
vae_ch_mult: [1, 1, 2, 2, 4]  

# VAR model configuration
tfast: 0                    # torch.compile VAR; 0: not compile; 1: reduce-overhead; 2: max-autotune
depth: 8                    # VAR depth

# VAR initialization
ini: -1                     # -1: automated model parameter initialization
hd: 0.02                    # head.w *= hd
aln: 0.5                    # multiplier of ada_lin.w's initialization
alng: 0.00001               # multiplier of ada_lin.w[gamma channels]'s initialization
zero_init: true            # whether to zero initialize the AdaLN layers

# diffusion parameters WONT BE USED FOR VAR ONLY
diffusion_args:
  train_steps: 1000          # timesteps for training
  inf_steps: 100             # timesteps for inference
  noise_schedule: 'cosine'          
  cont_time: true           # continuous or discrete time
  t_emb_dim: 256                     
  pstep: 'log'                       # 'lin' or 'log' scale for diffusion steps for patches
  time_clamp: 0.001                  # minimum timestep for sampling (for stable training)
  kv_cache: false                     # use KV cache (always enabled for var)

# optimization settings
fp16: 0                    # 0: fp32, 1: fp16, 2: bf16
tblr: 0.0002               # base learning rate = tlr * (bs / 256) = 0.0002 * (128 / 256) = 0.0001
twd: 0.05                  # initial weight decay
twde: 0                    # final weight decay (0 means use twd)
tclip: 2.0                 # gradient clipping (<=0 for no clipping)
ls: 0.0                    # label smoothing

# Batch size and accumulation
bs: 128                    # global batch size
ac: 1                      # gradient accumulation steps

# training schedule
ep: 250                    # number of epochs
wp: 0                      # warmup epochs (0 = auto: ep/50)
wp0: 0.005                 # initial lr ratio at beginning of warmup
wpe: 0.01                  # final lr ratio at end of training
sche: 'lin0'               # learning rate schedule

# optimizer
opt: 'adamw'               # optimizer: adamw or lion
afuse: true                # fused adamw

# model settings
saln: false                # shared adaln
anorm: true                # L2 normalized attention
fuse: true                 # fused operations (flash attention, etc.)
debug_mode: false          # enable debugging for diffusion models
cond_drop_rate: 0.1        # conditional dropout rate
drop_rate: 0.              # dropout rate
attn_drop_rate: 0.         # attention dropout rate


# data processing
pn: '1_2_3_4_5_6_8'        # patch numbers (or '256', '512', '1024' for presets)
patch_size: 16             # patch size
mid_reso: 1.125            # augmentation: resize factor before crop
hflip: false               # horizontal flip augmentation
workers: 0                 # data loader workers (0: auto, -1: no multiprocessing)
data_load_reso: 128        # image resolution for data loading

# progressive training
pg: 0.0                    # progressive training ratio (0.0 = disabled)
pg0: 4                     # progressive initial stage
pgwp: 0                    # warmup epochs per progressive stage (0 = auto)

# validation and metrics
val_freq: 2                # validation frequency
calc_img_mtcs: true        # calculate image quality metrics
image_metrics_freq: 150    # calculate metrics every N epochs
n_images: 100              # number of images for FID/metrics calculation
n_wandb_images: 16         # number of images to save to WandB 
image_bs: 32               # batch size for image metrics should be a divisor of bs

# Dataset configuration
num_classes: 10            # number of classes in dataset

# Environment settings
tf32: true                 # enable TensorFloat32
seed: null                 # random seed (null = random)
same_seed_for_all_ranks: 0 # distributed sampler seed setting
local_debug: false         # local debugging mode
dbg_nan: false             # debug NaN values